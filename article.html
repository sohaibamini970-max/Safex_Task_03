<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article — LogiNews</title>
    <meta name="description" content="Read the full story on LogiNews." />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#2563eb', 600: '#1d4ed8', 700: '#1e40af', 900: '#1e3a8a' },
                        ink: { 50: '#f8fafc', 100: '#f1f5f9', 700: '#334155', 800: '#1e293b', 900: '#0f172a' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Merriweather', 'Georgia', 'serif'],
                    },
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="bg-ink-50 text-ink-900 font-sans antialiased">
    <a href="#main"
        class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:bg-brand-600 focus:text-white focus:px-4 focus:py-2 focus:rounded">Skip
        to content</a>

    <div id="site-header"></div>

    <main id="main" class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

        <!-- Breadcrumb -->
        <nav class="text-sm text-ink-700 mb-6" aria-label="Breadcrumb">
            <ol class="flex flex-wrap items-center gap-2">
                <li><a href="index.html" class="hover:text-brand-600">Home</a></li>
                <li aria-hidden="true">/</li>
                <li id="breadcrumb-category"><a href="#" class="hover:text-brand-600">Category</a></li>
                <li aria-hidden="true">/</li>
                <li class="text-ink-900 font-medium truncate max-w-[16rem]" id="breadcrumb-title">Article</li>
            </ol>
        </nav>

        <!-- Article -->
        <article id="article-root">
            <!-- Injected -->
            <div class="animate-pulse space-y-4">
                <div class="h-6 bg-ink-100 rounded w-1/3"></div>
                <div class="h-10 bg-ink-100 rounded w-full"></div>
                <div class="h-10 bg-ink-100 rounded w-2/3"></div>
                <div class="h-64 bg-ink-100 rounded"></div>
            </div>
        </article>

        <!-- Share -->
        <div class="mt-8 pt-6 border-t border-ink-100 flex items-center gap-3">
            <span class="text-sm font-medium text-ink-700">Share:</span>
            <button data-share="twitter"
                class="text-sm px-3 py-1.5 rounded border border-ink-100 hover:bg-ink-100">Twitter</button>
            <button data-share="linkedin"
                class="text-sm px-3 py-1.5 rounded border border-ink-100 hover:bg-ink-100">LinkedIn</button>
            <button data-share="copy" class="text-sm px-3 py-1.5 rounded border border-ink-100 hover:bg-ink-100">Copy
                link</button>
        </div>

        <!-- Related -->
        <section class="mt-12">
            <h2 class="text-xl font-bold mb-4">Related stories</h2>
            <div id="related-posts" class="grid sm:grid-cols-2 gap-6"></div>
        </section>

    </main>

    <div id="site-footer"></div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cms.js"></script>
    <script src="js/components.js"></script>
    <script src="js/article.js"></script>
</body>

</html>
