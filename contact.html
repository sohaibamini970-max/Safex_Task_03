<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — LogiNews</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#2563eb', 600: '#1d4ed8', 700: '#1e40af', 900: '#1e3a8a' },
                        ink: { 50: '#f8fafc', 100: '#f1f5f9', 700: '#334155', 800: '#1e293b', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], serif: ['Merriweather', 'Georgia', 'serif'] },
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="bg-ink-50 text-ink-900 font-sans antialiased">
    <div id="site-header"></div>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
        <h1 class="text-3xl sm:text-4xl font-bold mb-3">Contact us</h1>
        <p class="text-ink-700 mb-8">Press enquiries, partnership requests or story tips — we read everything.</p>

        <form id="contact-form" class="bg-white rounded-xl shadow-sm p-6 sm:p-8 space-y-5" novalidate>
            <div>
                <label for="name" class="block text-sm font-medium mb-1">Name</label>
                <input id="name" name="name" type="text" required
                    class="w-full px-4 py-2.5 rounded-lg border border-ink-100 focus:outline-none focus:ring-2 focus:ring-brand-500" />
            </div>
            <div>
                <label for="email" class="block text-sm font-medium mb-1">Email</label>
                <input id="email" name="email" type="email" required
                    class="w-full px-4 py-2.5 rounded-lg border border-ink-100 focus:outline-none focus:ring-2 focus:ring-brand-500" />
            </div>
            <div>
                <label for="subject" class="block text-sm font-medium mb-1">Subject</label>
                <select id="subject" name="subject" required
                    class="w-full px-4 py-2.5 rounded-lg border border-ink-100 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <option value="">Choose…</option>
                    <option>Press enquiry</option>
                    <option>Partnership</option>
                    <option>Story tip</option>
                    <option>Other</option>
                </select>
            </div>
            <div>
                <label for="message" class="block text-sm font-medium mb-1">Message</label>
                <textarea id="message" name="message" rows="5" required
                    class="w-full px-4 py-2.5 rounded-lg border border-ink-100 focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
            </div>
            <button type="submit"
                class="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-6 py-3 rounded-lg transition">
                Send message
            </button>
            <p id="contact-msg" class="text-sm" role="status" aria-live="polite"></p>
        </form>
    </main>

    <div id="site-footer"></div>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/contact.js"></script>
</body>

</html>
